<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パーティクルサバイバー</title>
<style>
:root{color-scheme:dark;--bg:#090b13;--panel:#151a2a;--line:#2a3450;--fg:#edf2ff;--muted:#9ba8c4;--accent:#72e6ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Noto Sans JP",sans-serif}
#game{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#111626;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;letter-spacing:.04em}
#stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-variant-numeric:tabular-nums}
#stats b{color:var(--fg)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050814b8;padding:20px}
#dialog{width:min(440px,100%);background:#151d31;border:1px solid #394866;border-radius:18px;padding:22px;box-shadow:0 18px 60px #0009}
#dialog h2{margin:0 0 8px;font-size:23px}
#dialog p{color:#b8c5df;margin:8px 0 16px}
button{border:1px solid #435575;background:#263653;color:white;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
button:active{transform:translateY(1px)}
.primary{background:#176d83;border-color:#42c6df;font-weight:700;width:100%;padding:13px}
#hud{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel);border-top:1px solid var(--line)}
#xpwrap{height:9px;background:#30384c;border-radius:99px;overflow:hidden;flex:1;min-width:45px}
#xp{height:100%;width:0;background:linear-gradient(90deg,#53d9ff,#b2f5ff);transition:width .1s}
.ability{min-width:88px;position:relative;overflow:hidden;padding:8px 9px;font-size:12px}
.ability.ready{border-color:#70eaff;box-shadow:0 0 13px #49dfff66}
.ability small{display:block;color:#b9c8e3;font-size:10px}
#mobile{display:none;position:absolute;inset:auto 12px 12px 12px;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:116px;height:116px;border-radius:50%;background:#17243c99;border:1px solid #8ba5d966;position:relative;pointer-events:auto;touch-action:none}
#nub{position:absolute;width:42px;height:42px;border-radius:50%;background:#91dff0aa;left:36px;top:36px}
#touchAbilities{display:flex;flex-direction:column;gap:7px;pointer-events:auto}
#touchAbilities button{background:#17243ce8}
@media(max-width:650px){header{padding:8px 10px}#stats{gap:7px;font-size:12px}#hud{gap:6px;padding:7px}.ability{min-width:69px;padding:7px 5px;font-size:11px}#mobile{display:flex}}
</style>
</head>
<body>
<div id="game">
<header><h1>✦ パーティクルサバイバー</h1><div id="stats"><span>生存 <b id="time">0:00</b></span><span>Lv <b id="level">1</b></span><span>撃破 <b id="kills">0</b></span><span>HP <b id="hp">100</b></span></div></header>
<div id="stage"><canvas id="cv"></canvas>
<div id="mobile"><div id="stick"><div id="nub"></div></div><div id="touchAbilities"><button onclick="activate('burst')">バースト [Q]</button><button onclick="activate('dash')">ダッシュ [E]</button><button onclick="activate('magnet')">マグネット [R]</button></div></div>
<div id="overlay"><div id="dialog"><h2 id="dialogTitle">粒子の海を生き残れ</h2><p id="dialogText">粒子を操作して餌を集め、成長しながら生き残ろう。周囲の粒子は独自の相互作用で動き、時間とともに少しずつ性質が変化する。</p><p>PC: WASD / 矢印キーで移動、Q バースト・E ダッシュ・R マグネット。<br>スマホ: 左下スティックと右側ボタン。</p><button class="primary" id="start">ゲーム開始</button></div></div>
</div>
<div id="hud"><div style="white-space:nowrap">餌ゲージ</div><div id="xpwrap"><div id="xp"></div></div><button class="ability" id="burst" onclick="activate('burst')">バースト<small>斥力爆増</small></button><button class="ability" id="dash" onclick="activate('dash')">ダッシュ<small>力・速度増幅</small></button><button class="ability" id="magnet" onclick="activate('magnet')">マグネット<small>餌を吸引</small></button></div>
</div>
<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
const COLORS=['#ff6278','#ffbd58','#f3e66d','#65e69b','#60caff','#b68cff','#ff8bd1'];
const TYPES=7;
let W=1,H=1,dpr=1,last=0,elapsed=0,running=false,dead=false;
let player,particles=[],foods=[],M=[],keys={},joy={x:0,y:0},level=1,xp=0,kills=0,hp=100,spawnClock=0,foodClock=0;
let abilities={burst:{charge:0,cool:0,duration:0},dash:{charge:0,cool:0,duration:0},magnet:{charge:0,cool:0,duration:0}};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function randomMatrix(){M=Array.from({length:TYPES},(_,i)=>Array.from({length:TYPES},(_,j)=>rand(-.1,.1)));}
// Player's particle type attracts every type; same-type particles repel slightly.
function makePlayer(){return{x:W/2,y:H/2,vx:0,vy:0,r:9,speed:220,invuln:0};}
function spawnParticle(){
 const side=(Math.random()*4)|0,x=side===0?rand(0,W):side===1?W:side===2?rand(0,W):0,y=side===0?0:side===1?rand(0,H):side===2?H:rand(0,H);
 const t=(Math.random()*TYPES)|0;
 particles.push({x,y,vx:rand(-20,20),vy:rand(-20,20),type:t,r:rand(3.2,5.8),phase:rand(0,7),hp:1});
}
function spawnFood(){foods.push({x:rand(24,W-24),y:rand(24,H-24),r:4.2,life:rand(13,20),pulse:rand(0,6)});}
function reset(){randomMatrix();player=makePlayer();particles=[];foods=[];elapsed=0;level=1;xp=0;kills=0;hp=100;spawnClock=0;foodClock=0;dead=false;for(let i=0;i<26;i++)spawnParticle();for(let i=0;i<34;i++)spawnFood();for(const a of Object.values(abilities))Object.assign(a,{charge:0,cool:0,duration:0});updateHud();}
function perturb(){for(let i=0;i<TYPES;i++)for(let j=0;j<TYPES;j++)M[i][j]=clamp(M[i][j]+rand(-.1,.1),-1,1);}
function activate(name){if(!running||dead)return;const a=abilities[name];if(a.charge<100||a.cool>0)return;a.charge=0;
 if(name==='burst'){a.duration=0.9;a.cool=4.5;}
 if(name==='dash'){a.duration=1.15;a.cool=5.5;const v=Math.hypot(player.vx,player.vy);let dx=v?player.vx/v:joy.x||1,dy=v?player.vy/v:joy.y;player.vx+=dx*570;player.vy+=dy*570;player.invuln=.65;}
 if(name==='magnet'){a.duration=5.2;a.cool=7;}
 updateHud();}
window.activate=activate;
function update(dt){
 elapsed+=dt;const a=abilities;
 for(const v of Object.values(a)){v.cool=Math.max(0,v.cool-dt);v.duration=Math.max(0,v.duration-dt);}
 if(Math.floor(elapsed/7)!==Math.floor((elapsed-dt)/7))perturb();
 let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x;
 let dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y;
 const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}
 const dash=a.dash.duration>0?1.8:1;
 player.vx+=dx*player.speed*dt*7;player.vy+=dy*player.speed*dt*7;
 const drag=Math.pow(.025,dt);player.vx*=drag;player.vy*=drag;
 const vmax=player.speed*dash;const pv=Math.hypot(player.vx,player.vy);if(pv>vmax){player.vx*=vmax/pv;player.vy*=vmax/pv}
 player.x=clamp(player.x+player.vx*dt,player.r,W-player.r);player.y=clamp(player.y+player.vy*dt,player.r,H-player.r);player.invuln=Math.max(0,player.invuln-dt);
 // Particle Life-style forces: the protagonist's species attracts all particles (+0.3),
 // while its own species has a mild repulsion (-0.15). Other interactions drift randomly.
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i],dxp=player.x-p.x,dyp=player.y-p.y,dist=Math.hypot(dxp,dyp)||1;
  const attract=dist<250?1-dist/250:0;
  const playerForce=(p.type===0?-.15:.3)*attract;
  p.vx+=dxp/dist*playerForce*170*dt;p.vy+=dyp/dist*playerForce*170*dt;
  // Ambient particles also respond to nearby particles using their evolving matrix.
  let fx=0,fy=0;
  for(let j=0;j<particles.length;j+=3){if(i===j)continue;const q=particles[j],x=q.x-p.x,y=q.y-p.y,d2=x*x+y*y;if(d2<1||d2>78*78)continue;const d=Math.sqrt(d2),f=M[p.type][q.type]*(1-d/78)*26;fx+=x/d*f;fy+=y/d*f;}
  p.vx+=fx*dt;p.vy+=fy*dt;p.vx*=Math.pow(.22,dt);p.vy*=Math.pow(.22,dt);
  const sp=Math.hypot(p.vx,p.vy);if(sp>95){p.vx*=95/sp;p.vy*=95/sp}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;p.x=clamp(p.x,0,W);p.y=clamp(p.y,0,H);
  const hit=Math.hypot(p.x-player.x,p.y-player.y);
  if(hit<p.r+player.r+1){
   if(a.burst.duration>0){p.hp-=dt*5;const f=520*dt;p.vx+=dxp/dist*f;p.vy+=dyp/dist*f;if(p.hp<=0){particles.splice(i,1);kills++;xp+=5;}}
   else if(player.invuln<=0){hp-=12;player.invuln=.7;const nx=(player.x-p.x)/hit,ny=(player.y-p.y)/hit;player.vx+=nx*170;player.vy+=ny*170;}
  }
 }
 spawnClock+=dt;if(spawnClock>Math.max(.25,1.15-elapsed*.004)&&particles.length<100){spawnClock=0;spawnParticle()}
 foodClock+=dt;if(foodClock>1.05&&foods.length<65){foodClock=0;spawnFood()}
 for(let i=foods.length-1;i>=0;i--){const f=foods[i];f.life-=dt;f.pulse+=dt*5;
  if(a.magnet.duration>0){const x=player.x-f.x,y=player.y-f.y,d=Math.hypot(x,y)||1;if(d<300){f.x+=x/d*390*dt;f.y+=y/d*390*dt}}
  if(Math.hypot(f.x-player.x,f.y-player.y)<player.r+f.r+7){foods.splice(i,1);xp+=12;for(const k of Object.values(a))k.charge=clamp(k.charge+17,0,100);if(xp>=level*70){xp-=level*70;level++;hp=Math.min(100,hp+10);player.speed+=5;}}
  else if(f.life<=0)foods.splice(i,1);
 }
 if(hp<=0){hp=0;dead=true;running=false;showEnd()}
 updateHud();
}
function updateHud(){$('time').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('level').textContent=level;$('kills').textContent=kills;$('hp').textContent=Math.ceil(hp);$('xp').style.width=(xp/(level*70)*100)+'%';
 for(const name of ['burst','dash','magnet']){const el=$(name),v=abilities[name];el.classList.toggle('ready',v.charge>=100&&v.cool<=0);el.innerHTML=({burst:'バースト',dash:'ダッシュ',magnet:'マグネット'})[name]+'<small>'+(v.duration>0?'発動中':v.cool>0?'再使用 '+v.cool.toFixed(1)+'秒':Math.floor(v.charge)+'%')+'</small>';}
}
function showEnd(){$('dialogTitle').textContent='ゲームオーバー';$('dialogText').textContent=`生存時間 ${$('time').textContent} / レベル ${level} / 撃破 ${kills}。もう一度挑戦しよう。`;$('start').textContent='もう一度プレイ';$('overlay').style.display='flex'}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#080d19';ctx.fillRect(0,0,W,H);
 // subtle background grid
 ctx.strokeStyle='#172239';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<W;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<H;y+=40){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
 for(const f of foods){ctx.beginPath();ctx.arc(f.x,f.y,f.r+Math.sin(f.pulse)*1.2,0,Math.PI*2);ctx.fillStyle='#8bffbd';ctx.shadowColor='#6dffb0';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0}
 for(const p of particles){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=COLORS[p.type];ctx.globalAlpha=.9;ctx.fill();ctx.globalAlpha=1}
 const b=abilities.burst.duration>0;ctx.beginPath();ctx.arc(player.x,player.y,player.r+(b?22:0),0,Math.PI*2);ctx.strokeStyle=b?'#ff8d62':'#8cecff';ctx.lineWidth=b?4:2;ctx.globalAlpha=b?.75:.35;ctx.stroke();ctx.globalAlpha=1;
 ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fillStyle=player.invuln>0?'#ffffff': '#70eaff';ctx.shadowColor='#55dfff';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
 ctx.beginPath();ctx.arc(player.x-2.5,player.y-2.5,2.4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(running)update(dt);draw();requestAnimationFrame(loop)}
$('start').onclick=()=>{reset();$('overlay').style.display='none';running=true};
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='q')activate('burst');if(e.key.toLowerCase()==='e')activate('dash');if(e.key.toLowerCase()==='r')activate('magnet')});
addEventListener('keyup',e=>keys[e.key]=false);
const stick=$('stick'),nub=$('nub');let pointer=null;
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveStick(e)});
function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy,l=Math.hypot(x,y),m=36;if(l>m){x*=m/l;y*=m/l}joy.x=x/m;joy.y=y/m;nub.style.transform=`translate(${x}px,${y}px)`}
function releaseStick(){pointer=null;joy.x=joy.y=0;nub.style.transform=''}
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
